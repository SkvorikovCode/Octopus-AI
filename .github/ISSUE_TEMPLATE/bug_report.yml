name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please **do not paste API keys or private code** here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project…
        2. Start an agent with…
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Octopus version or commit
      placeholder: 0.1.0 / main@abc1234
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 (Apple Silicon)
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine version
      description: Output of `omp --version`
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact keys, tokens and anything private.
      render: shell
