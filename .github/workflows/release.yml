name: Release

# Runs only when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# never on ordinary commits. It builds the app and attaches it to a DRAFT release;
# a maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag must be on main and match the app version
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1; }
          want="${GITHUB_REF_NAME#v}"
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$want tauri.conf=$tauri package.json=$pkg Cargo.toml=$cargo"
          for v in "$tauri" "$pkg" "$cargo"; do
            [ "$v" = "$want" ] || { echo "::error::Version mismatch: tag says $want, files say $tauri / $pkg / $cargo"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Update signing key must be set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (see RELEASING.md)"; exit 1; }'

      - name: Fetch the agent engine (pinned in engine.lock, checksum verified)
        run: scripts/fetch-engine.sh

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update archive; the app checks it against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Octopus AI ${{ github.ref_name }}
          releaseDraft: true
          # Not a pre-release: the app looks for updates at releases/latest, which skips pre-releases.
          prerelease: false
          # latest.json: the update feed the app reads.
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json
          releaseBody: |
            **Preview build for Apple Silicon Macs (macOS 11+).** Not signed or notarized yet.
            The agent engine is bundled, so there is nothing else to install. Later versions arrive
            as in-app updates.

            ### Install
            1. Download the `.dmg` below and drag Octopus into Applications.
            2. Open Octopus. macOS will say it could not verify the developer: press **Done**, open **System Settings → Privacy & Security**, scroll down and press **Open Anyway** next to Octopus, then confirm. This is needed once.
               Or, in Terminal: `xattr -dr com.apple.quarantine /Applications/Octopus.app`

            ### Linux (x86_64)
            `.AppImage` runs on most distributions and updates itself in the app. `.deb` is for Debian and Ubuntu, updated with the system. Needs WebKitGTK 4.1, and a Secret Service (GNOME Keyring or KWallet) to keep provider keys.

            On first launch the app asks for a provider key. Found a problem? [Open an issue](https://github.com/SkvorikovCode/Octopus-AI/issues/new/choose).

  linux-x64:
    name: Linux (x86_64)
    # After macOS: both jobs upload to one draft release, and two jobs creating it at
    # once would make two drafts. The tag and version checks ran there already.
    needs: macos-arm64
    # The oldest supported runner: its glibc is what the AppImage needs at least.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Fetch the agent engine (pinned in engine.lock, checksum verified)
        run: scripts/fetch-engine.sh x86_64-unknown-linux-gnu

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Adds the Linux files and the linux-x86_64 entry of latest.json to the draft macOS made.
          tagName: ${{ github.ref_name }}
          releaseName: Octopus AI ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles deb,appimage
