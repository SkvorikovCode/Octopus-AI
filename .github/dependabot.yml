version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci" }
